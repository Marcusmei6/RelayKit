name: macOS App

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: macOS App / Swift and headless package validation
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Swift package
        working-directory: app
        run: swift build
      - name: Run App validation executable
        working-directory: app
        run: swift run RelayKitAppValidationTests
      - name: Verify headless App bundle
        run: ./script/build_app_bundle.sh --verify
      - name: Verify headless local package
        run: ./script/package_release.sh --verify
