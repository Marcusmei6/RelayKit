name: macOS Runtime Safety

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-safety:
    name: macOS Runtime Safety
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select Swift 6 toolchain
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
          test "$(xcode-select --print-path)" = "/Applications/Xcode_16.2.app/Contents/Developer"
          swift_version="$(swift --version)"
          printf '%s\n' "${swift_version}"
          grep -Eq 'Swift version 6\.' <<<"${swift_version}"
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Verify offline safety contract
        run: ./scripts/runtime-safety-fault-injection-test.sh
      - name: Run isolated fault harness
        run: ./scripts/runtime-safety-fault-injection.sh
      - name: Verify launchd socket-activation contract
        run: ./scripts/runtime-safety-launchd-proof-test.sh
      - name: Run isolated launchd socket-activation proof
        run: ./scripts/runtime-safety-launchd-proof.sh
